name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build & Verify Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fewfeww
          POSTGRES_USER: fewfeww
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compilation
        run: npm run build

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://fewfeww:devpassword@localhost:5432/fewfeww
        run: npm run migrate

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: postgres://fewfeww:devpassword@localhost:5432/fewfeww
          TELEGRAM_BOT_TOKEN: 9030304361:test_token
          TELEGRAM_WEBHOOK_SECRET: webhook-dev-fewfeww
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: npm test
