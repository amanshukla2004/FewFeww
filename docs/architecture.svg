<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ingressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="roseCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="0.5">FEWFEWW SYSTEM ARCHITECTURE</text>
  <text x="500" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Telegram-First Omnichannel Follow-Through Assistant &amp; Persistent Row-Level Scheduler</text>

  <!-- ================= SECTION 1: INGRESS ================= -->
  <rect x="50" y="95" width="900" height="105" rx="14" fill="url(#ingressGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="75" y="122" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">1. MULTI-CHANNEL INGRESS LAYER</text>

  <!-- Channel 1: Telegram -->
  <g transform="translate(80, 135)">
    <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="14" fill="#0284c7"/>
    <text x="28" y="30" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">TG</text>
    <text x="52" y="23" fill="#f8fafc" font-size="12.5" font-weight="700">Telegram Bot API</text>
    <text x="52" y="38" fill="#94a3b8" font-size="10.5">@FewFewwDevBot (Long Poll / Hook)</text>
  </g>

  <!-- Channel 2: WhatsApp -->
  <g transform="translate(375, 135)">
    <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="14" fill="#059669"/>
    <text x="28" y="30" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">WA</text>
    <text x="52" y="23" fill="#f8fafc" font-size="12.5" font-weight="700">WhatsApp Cloud API</text>
    <text x="52" y="38" fill="#94a3b8" font-size="10.5">Signed HMAC-SHA256 Webhooks</text>
  </g>

  <!-- Channel 3: Things 3 Web Client -->
  <g transform="translate(670, 135)">
    <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="14" fill="#4f46e5"/>
    <text x="28" y="30" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">UI</text>
    <text x="52" y="23" fill="#f8fafc" font-size="12.5" font-weight="700">Things 3 Web Client</text>
    <text x="52" y="38" fill="#94a3b8" font-size="10.5">Port 3000 Dashboard &amp; Admin</text>
  </g>

  <!-- Ingress Flow Arrows -->
  <path d="M 205 185 L 205 240 L 320 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500 185 L 500 240 L 320 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 795 185 L 795 240 L 680 240" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= SECTION 2: BACKEND ENGINE ================= -->
  <rect x="50" y="215" width="900" height="260" rx="14" fill="url(#coreGrad)" stroke="#475569" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="75" y="240" fill="#a855f7" font-size="11" font-weight="700" letter-spacing="1">2. FEWFEWW BACKEND CORE (FASTIFY + NODE.JS 24 LTS)</text>

  <!-- Module 1: Ingress & Idempotency -->
  <g transform="translate(80, 255)">
    <rect width="240" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="28" fill="#38bdf8" font-size="13" font-weight="700">Idempotency &amp; Ingress</text>
    <text x="18" y="48" fill="#f1f5f9" font-size="11">Deduplicates incoming update_id</text>
    <text x="18" y="66" fill="#94a3b8" font-size="10.5">Table: inbox_updates</text>
    <rect x="18" y="73" width="165" height="15" rx="4" fill="#0284c7" fill-opacity="0.25"/>
    <text x="24" y="84" fill="#38bdf8" font-size="9" font-weight="700">ON CONFLICT DO NOTHING</text>
  </g>

  <!-- Module 2: UpdateDispatcher -->
  <g transform="translate(360, 255)">
    <rect width="280" height="95" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="18" y="28" fill="#818cf8" font-size="13" font-weight="700">UpdateDispatcher Engine</text>
    <text x="18" y="48" fill="#f1f5f9" font-size="11">Directs message flow by intent</text>
    <text x="18" y="66" fill="#cbd5e1" font-size="10.5">- Multi-turn clarification state</text>
    <text x="18" y="82" fill="#cbd5e1" font-size="10.5">- Inbound text, voice (Whisper), vision</text>
  </g>

  <!-- Module 3: Groq LLM & Tool Calling -->
  <g transform="translate(680, 255)">
    <rect width="240" height="95" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="18" y="28" fill="#ec4899" font-size="13" font-weight="700">Groq LPU Tool-Caller</text>
    <text x="18" y="48" fill="#f1f5f9" font-size="11">Model: openai/gpt-oss-120b</text>
    <text x="18" y="66" fill="#94a3b8" font-size="10.5">TTFT: ~120ms | 400 t/s</text>
    <rect x="18" y="73" width="180" height="15" rx="4" fill="#db2777" fill-opacity="0.25"/>
    <text x="24" y="84" fill="#f472b6" font-size="9" font-weight="700">22 Functional Tool Bindings</text>
  </g>

  <!-- Internal Engine Arrows -->
  <path d="M 320 302 L 352 302" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 302 L 672 302" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lower Engine Tier -->
  <!-- Deterministic Date Engine -->
  <g transform="translate(180, 370)">
    <rect width="280" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="28" fill="#10b981" font-size="13" font-weight="700">Deterministic Date Resolver</text>
    <text x="18" y="48" fill="#f1f5f9" font-size="11">chrono-node + luxon timezones</text>
    <text x="18" y="66" fill="#94a3b8" font-size="10.5">Zero date hallucination | Exact UTC</text>
  </g>

  <!-- 5-Stage Nudge Ladder Scheduler -->
  <g transform="translate(540, 370)">
    <rect width="320" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f59e0b" font-size="13" font-weight="700">5-Stage Nudge Ladder Scheduler</text>
    <text x="18" y="48" fill="#f1f5f9" font-size="11">Row-Level SKIP LOCKED Poller</text>
    <text x="18" y="66" fill="#94a3b8" font-size="10.5">Stage 1 Whisper &#8594; 3 Starter &#8594; 4 Voice</text>
  </g>

  <path d="M 780 350 L 780 365 L 700 370" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 460 412 L 532 412" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= SECTION 3: STORAGE & OUTLETS ================= -->
  <!-- Database (Left) -->
  <g transform="translate(80, 495)">
    <rect width="450" height="155" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="24" y="30" fill="#38bdf8" font-size="14" font-weight="800" letter-spacing="1">POSTGRESQL 17 (DOCKER CONTAINER)</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Primary transactional state store with zero Redis dependency</text>
    
    <g transform="translate(24, 65)">
      <rect width="180" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" fill="#f8fafc" font-size="11" font-weight="600">23 Relational Tables</text>
    </g>
    <g transform="translate(220, 65)">
      <rect width="195" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" fill="#f8fafc" font-size="11" font-weight="600">pg_trgm Trigram Search</text>
    </g>
    <g transform="translate(24, 105)">
      <rect width="180" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" fill="#f8fafc" font-size="11" font-weight="600">SKIP LOCKED Row Queue</text>
    </g>
    <g transform="translate(220, 105)">
      <rect width="195" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" fill="#f8fafc" font-size="11" font-weight="600">Zero-Knowledge Masking</text>
    </g>
  </g>

  <!-- External Escalation Outlets (Right) -->
  <g transform="translate(570, 495)">
    <rect width="350" height="155" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="24" y="30" fill="#fb7185" font-size="14" font-weight="800" letter-spacing="1">OUTBOUND ESCALATION OUTLETS</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11">Multi-stage proactive follow-through delivery</text>
    
    <g transform="translate(24, 65)">
      <rect width="300" height="32" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4"/>
      <circle cx="16" cy="16" r="6" fill="#10b981"/>
      <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="600">Stage 1 &amp; 2: Telegram / WhatsApp DMs</text>
    </g>
    <g transform="translate(24, 105)">
      <rect width="300" height="32" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4"/>
      <circle cx="16" cy="16" r="6" fill="#f43f5e"/>
      <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="600">Stage 4: Twilio Outbound AI Phone Calls</text>
    </g>
  </g>

  <!-- Connectors to Storage & Outlets -->
  <path d="M 320 455 L 320 490" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 700 455 L 700 490" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
</svg>